<div class="workspace">
  <header class="app-header">
    <div class="header-top">
      <div class="header-location">
        <button
          id="menuButton"
          onclick="toggleSidebar()"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          ☰</button
        ><span class="breadcrumb">Mi espacio <span>/</span></span>
        <h2 id="currentTabHeaderLabel">Hoy</h2>
      </div>
      <div class="header-actions">
        <button id="cloudStatusBadge" onclick="switchTab('settings')">
          En este dispositivo</button
        ><button
          class="icon-action"
          onclick="undoLastChange()"
          aria-label="Deshacer último cambio"
          title="Deshacer"
        >
          ↶</button
        ><button
          class="icon-action"
          onclick="copyDailyReport()"
          aria-label="Copiar resumen del día"
          title="Copiar resumen"
        >
          ↗</button
        ><button
          id="themeBtn"
          class="icon-action"
          onclick="toggleTheme()"
          aria-label="Cambiar tema"
        ></button>
      </div>
    </div>
    <div class="calendar-row">
      <div class="date-label">
        <span id="selectedDateLabel"></span
        ><button onclick="selectDay(getLocalTodayIso())">Volver a hoy</button>
      </div>
      <div id="calendarBar" aria-label="Calendario semanal"></div>
    </div>
  </header>
  <main id="appMain" tabindex="-1"></main>
  <footer class="app-footer">Pequeñas acciones. Un día a la vez.</footer>
</div>
